[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarka-md"
version = "0.2.0"
description = "NEPSE level 1 / level 2 market data capture"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]==0.28.1",
    "pyarrow>=15",
    # Only used for NEPSE's WASM token de-obfuscation (see src/tarka_md/auth.py).
    # Pinned to a commit because NEPSE changes its scheme without notice.
    "nepse @ git+https://github.com/basic-bgnr/NepseUnofficialApi.git@180a550c60f1959983b854659e650a4c189a3c0f",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tarka-md = "tarka_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
